<text x="24" y="428" xml:space="preserve">21 of the catalogue threats apply to 'Customer support assistant' (0 <tspan fill="#FF7B72">critical</tspan>, 14 <tspan fill="#FF7B72">high</tspan>, 7 <tspan fill="#E3B341">medium</tspan>, 0</text>
<text x="24" y="448" xml:space="preserve"><tspan fill="#7EE787">low</tspan> after mitigations). Residual risk score 99/100 (<tspan fill="#FF7B72">Critical</tspan>). The 1 control(s) in place reduce</text>
<text x="24" y="468" xml:space="preserve">modelled risk by 1% compared with the same system with no controls.</text>
<text x="24" y="508" xml:space="preserve">Highest-leverage missing controls:</text>
<text x="24" y="528" xml:space="preserve">  - approval-gates: Human approval for high-impact actions (mitigates 9 applicable threat(s))</text>
<text x="24" y="548" xml:space="preserve">  - audit-log: Tamper-evident audit log of every tool call (mitigates 9 applicable threat(s))</text>
<text x="24" y="568" xml:space="preserve">  - least-privilege-tool-scopes: Least-privilege scopes on every tool (mitigates 8 applicable</text>
<text x="24" y="588" xml:space="preserve">threat(s))</text>
<text x="24" y="608" xml:space="preserve">  - adversarial-testing: Adversarial testing before and after release (mitigates 4 applicable</text>
<text x="24" y="628" xml:space="preserve">threat(s))</text>
<text x="24" y="648" xml:space="preserve">  - brokered-credentials: Short-lived, scoped, brokered credentials (mitigates 4 applicable</text>
<text x="24" y="668" xml:space="preserve">threat(s))</text>
<text x="24" y="708" xml:space="preserve"><tspan fill="#7FD1AE">$ atm diff examples/finance-agent.yaml examples/governed-agent.yaml</tspan></text>
