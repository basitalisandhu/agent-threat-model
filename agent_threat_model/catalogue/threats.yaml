# Threat catalogue for agent-threat-model.
#
# Fields
#   stride         spoofing | tampering | repudiation | information-disclosure |
#                  denial-of-service | elevation-of-privilege
#   owasp_llm      OWASP Top 10 for LLM Applications 2025 ids (LLM01..LLM10)
#   owasp_agentic  OWASP Top 10 for Agentic Applications 2026 ids (ASI01..ASI10),
#                  as published by the OWASP GenAI Security Project (December
#                  2025); empty where no entry fits.
#   mitre_atlas    MITRE ATLAS technique ids (validated against references.py)
#   applies_when   rule in the DSL described in docs/input-format.md
#   likelihood     1..5, impact 1..5; inherent severity = likelihood x impact
#   mitigations    control ids from controls.yaml
threats:
  - id: indirect-prompt-injection
    title: Indirect prompt injection via untrusted channel
    description: >-
      Content the agent reads from an untrusted channel (email, web pages,
      documents, retrieved passages, API responses) carries instructions that
      the model follows as if they came from the operator. Every tool the agent
      can reach becomes available to whoever wrote that content.
    stride: tampering
    owasp_llm: [LLM01]
    owasp_agentic: [ASI01]
    mitre_atlas: [AML.T0051.001]
    applies_when: untrusted_channel_in_agent_inputs
    likelihood: 4
    impact: 4
    mitigations:
      - input-provenance-tagging
      - untrusted-content-isolation
      - prompt-injection-filtering
      - least-privilege-tool-scopes
      - approval-gates
    references:
      - https://github.com/OWASP/www-project-top-10-for-large-language-model-applications/blob/main/2_0_vulns/LLM01_PromptInjection.md

  - id: direct-prompt-injection
    title: Direct prompt injection and jailbreak by a user
    description: >-
      A user types instructions that override the system prompt or safety
      guidance, then uses the agent's tools for purposes the operator did not
      intend. Any agent that accepts user input and has tools is exposed.
    stride: tampering
    owasp_llm: [LLM01]
    owasp_agentic: [ASI01]
    mitre_atlas: [AML.T0051.000, AML.T0054]
    applies_when:
      all:
        - "agent_has_input_of_origin(origin=user)"
        - agent_has_any_tool
    likelihood: 4
    impact: 3
    mitigations:
      - least-privilege-tool-scopes
      - runtime-policy-enforcement
      - approval-gates
      - prompt-injection-filtering
      - adversarial-testing

  - id: tool-poisoning
    title: Tool poisoning via third-party tool descriptions
    description: >-
      A third-party tool or tool server ships descriptions, schemas or results
      that contain hidden instructions. The model reads them as trusted
      configuration and can be steered to leak data or call other tools.
    stride: tampering
    owasp_llm: [LLM01, LLM03]
    owasp_agentic: [ASI04, ASI01]
    mitre_atlas: [AML.T0110, AML.T0115.002, AML.T0011.002, AML.T0099]
    applies_when: third_party_tool
    likelihood: 3
    impact: 4
    mitigations:
      - tool-integrity-pinning
      - input-provenance-tagging
      - least-privilege-tool-scopes
      - approval-gates
    references:
      - https://modelcontextprotocol.io/specification/2025-06-18/basic/security_best_practices

  - id: credential-exfiltration-via-tool-args
    title: Credential exfiltration through tool call arguments
    description: >-
      A tool holds a static key that is visible to the model (in configuration,
      descriptions or memory) and another tool can send data outward. An
      injected instruction asks the model to place the secret into a URL,
      message body or file that leaves the system.
    stride: information-disclosure
    owasp_llm: [LLM02, LLM01]
    owasp_agentic: [ASI02, ASI03]
    mitre_atlas: [AML.T0098, AML.T0086, AML.T0083]
    applies_when:
      all:
        - "tool_auth_in(auth=static-key)"
        - "agent_has_tool_kind(kinds=network|messaging|write)"
    likelihood: 3
    impact: 5
    mitigations:
      - secrets-out-of-context
      - brokered-credentials
      - egress-allowlist
      - argument-validation
      - audit-log

  - id: excessive-agency
    title: Excessive agency on write, exec or payment tools
    description: >-
      An agent that may act on its own can call a tool with side effects
      without any approval step. One wrong inference, one injected instruction
      or one hallucinated argument becomes a real-world action.
    stride: elevation-of-privilege
    owasp_llm: [LLM06]
    owasp_agentic: [ASI02, ASI03]
    mitre_atlas: [AML.T0053]
    applies_when: "tool_kind_without_approval(kinds=write|exec|payment)"
    likelihood: 4
    impact: 4
    mitigations:
      - approval-gates
      - runtime-policy-enforcement
      - least-privilege-tool-scopes
      - audit-log
      - kill-switch
    references:
      - https://github.com/OWASP/www-project-top-10-for-large-language-model-applications/blob/main/2_0_vulns/LLM06_ExcessiveAgency.md

  - id: ssrf-via-url-tool
    title: Server-side request forgery through URL-accepting tools
    description: >-
      A tool fetches URLs chosen by the model. Attacker-influenced input makes
      it request internal services, cloud metadata endpoints or private
      address ranges, and the response flows back into the context.
    stride: information-disclosure
    owasp_llm: [LLM06, LLM05]
    owasp_agentic: [ASI02]
    mitre_atlas: [AML.T0053]
    applies_when: "agent_has_tool_kind(kinds=network)"
    likelihood: 3
    impact: 4
    mitigations:
      - egress-allowlist
      - argument-validation
      - sandboxed-execution
      - audit-log
    references:
      - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html

  - id: data-exfiltration-via-messaging
    title: Data exfiltration through messaging tools
    description: >-
      The agent can send email or chat messages and also reads untrusted
      content or sensitive data. An injected instruction forwards that data
      to an attacker-chosen recipient in a message that looks routine.
    stride: information-disclosure
    owasp_llm: [LLM02, LLM01]
    owasp_agentic: [ASI02]
    mitre_atlas: [AML.T0086, AML.T0025]
    applies_when:
      all:
        - "agent_has_tool_kind(kinds=messaging)"
        - any:
            - untrusted_channel_in_agent_inputs
            - "agent_reaches_sensitive_store(min=confidential)"
    likelihood: 3
    impact: 5
    mitigations:
      - egress-allowlist
      - dlp-outbound
      - approval-gates
      - input-provenance-tagging
      - audit-log

  - id: memory-poisoning
    title: Persistent memory poisoning
    description: >-
      The agent writes what it learns into long-term memory. Content from one
      interaction (possibly injected) is stored and later retrieved as trusted
      context, so a single poisoned message steers every future session.
    stride: tampering
    owasp_llm: [LLM01, LLM04]
    owasp_agentic: [ASI06]
    mitre_atlas: [AML.T0080.000]
    applies_when: "agent_memory_is(memory=persistent)"
    likelihood: 3
    impact: 4
    mitigations:
      - memory-write-validation
      - session-isolation
      - input-provenance-tagging
      - audit-log

  - id: unsandboxed-exec
    title: Unsandboxed code or shell execution
    description: >-
      An exec tool runs model-chosen commands on a host that holds
      credentials, source code or network access. Any injection or mistake
      becomes arbitrary code execution with the host's privileges.
    stride: elevation-of-privilege
    owasp_llm: [LLM06, LLM05]
    owasp_agentic: [ASI05]
    mitre_atlas: [AML.T0050, AML.T0105, AML.T0072]
    applies_when: "tool_kind_not_sandboxed(kinds=exec)"
    likelihood: 4
    impact: 5
    mitigations:
      - sandboxed-execution
      - approval-gates
      - egress-allowlist
      - kill-switch
      - audit-log

  - id: static-long-lived-credentials
    title: Static long-lived credentials held by the agent
    description: >-
      Tools authenticate with static keys that do not expire. If a key leaks
      through logs, prompts or an injected exfiltration it remains valid until
      someone notices, and it cannot be scoped to a single task.
    stride: information-disclosure
    owasp_llm: [LLM02]
    owasp_agentic: [ASI03]
    mitre_atlas: [AML.T0055, AML.T0083]
    applies_when: "tool_auth_in(auth=static-key)"
    likelihood: 3
    impact: 4
    mitigations:
      - brokered-credentials
      - secrets-out-of-context
      - audit-log
      - kill-switch

  - id: unauthenticated-tool
    title: Side-effecting tool with no authentication
    description: >-
      A tool that writes, executes, pays, sends or fetches requires no
      authentication at all. Calls cannot be attributed to an agent or
      principal, and anything that can reach the endpoint can use it.
    stride: spoofing
    owasp_llm: [LLM06]
    owasp_agentic: [ASI03]
    mitre_atlas: [AML.T0053]
    applies_when: "tool_auth_in(auth=none, kinds=write|exec|payment|messaging|network)"
    likelihood: 3
    impact: 4
    mitigations:
      - agent-identity
      - brokered-credentials
      - audit-log

  - id: missing-audit-trail
    title: No tamper-evident audit trail of tool calls
    description: >-
      Tool calls are not recorded in a store the agent cannot modify. After
      an incident nobody can say which input triggered which action, and the
      agent's actions can be repudiated or quietly altered.
    stride: repudiation
    owasp_llm: []
    owasp_agentic: [ASI10]
    mitre_atlas: []
    applies_when:
      all:
        - "control_missing(control=audit-log)"
        - agent_has_any_tool
    likelihood: 4
    impact: 3
    mitigations:
      - audit-log
      - behavioural-monitoring
      - incident-response-playbook
    references:
      - https://atlas.mitre.org/mitigations/AML.M0024

  - id: missing-kill-switch
    title: No kill switch or credential revocation
    description: >-
      An agent that acts in the world cannot be stopped quickly. When
      behaviour goes wrong the only options are to find the process and the
      keys by hand while actions keep happening.
    stride: elevation-of-privilege
    owasp_llm: [LLM06]
    owasp_agentic: [ASI10, ASI08]
    mitre_atlas: []
    applies_when:
      all:
        - "control_missing(control=kill-switch)"
        - "agent_autonomy_in(autonomy=act|act-with-approval)"
    likelihood: 3
    impact: 4
    mitigations:
      - kill-switch
      - brokered-credentials
      - incident-response-playbook

  - id: rag-poisoning
    title: Retrieval corpus poisoning
    description: >-
      The agent retrieves passages from an index. Anyone who can get a
      document into that index (shared drives, ticket systems, public pages)
      can plant content that is retrieved as authoritative and acted on.
    stride: tampering
    owasp_llm: [LLM08, LLM04, LLM01]
    owasp_agentic: [ASI06]
    mitre_atlas: [AML.T0070, AML.T0071, AML.T0066]
    applies_when: "agent_has_channel_kind(kinds=rag)"
    likelihood: 3
    impact: 4
    mitigations:
      - rag-source-vetting
      - input-provenance-tagging
      - prompt-injection-filtering
      - audit-log
    references:
      - https://github.com/OWASP/www-project-top-10-for-large-language-model-applications/blob/main/2_0_vulns/LLM08_VectorAndEmbeddingWeaknesses.md

  - id: over-permissive-scopes
    title: Over-permissive tool scopes
    description: >-
      A tool is granted wildcard, admin or undeclared scope. Whatever goes
      wrong, the blast radius is the whole account rather than the one
      resource the task needed.
    stride: elevation-of-privilege
    owasp_llm: [LLM06]
    owasp_agentic: [ASI03]
    mitre_atlas: [AML.T0053]
    applies_when: tool_scope_broad
    likelihood: 3
    impact: 4
    mitigations:
      - least-privilege-tool-scopes
      - brokered-credentials
      - approval-gates

  - id: approval-fatigue
    title: Approval fatigue leads to rubber-stamping
    description: >-
      Many tools demand approval on every call, so reviewers click through
      without reading. The approval step still exists on paper but no longer
      catches anything.
    stride: elevation-of-privilege
    owasp_llm: [LLM06]
    owasp_agentic: [ASI09]
    mitre_atlas: []
    applies_when: "approval_always_tool_count_at_least(min=3)"
    likelihood: 3
    impact: 3
    mitigations:
      - approval-fatigue-controls
      - runtime-policy-enforcement
      - least-privilege-tool-scopes

  - id: insecure-output-handling
    title: Model output consumed without validation
    description: >-
      Downstream components render model output in a browser, pass it to a
      shell or database, or execute it. Injected or malformed output becomes
      cross-site scripting, command injection or unintended writes.
    stride: tampering
    owasp_llm: [LLM05]
    owasp_agentic: [ASI05]
    mitre_atlas: [AML.T0077, AML.T0067]
    applies_when:
      any:
        - "agent_has_tool_kind(kinds=exec|write)"
        - "agent_has_channel_kind(kinds=web)"
    likelihood: 3
    impact: 3
    mitigations:
      - output-encoding
      - argument-validation
      - sandboxed-execution
    references:
      - https://github.com/OWASP/www-project-top-10-for-large-language-model-applications/blob/main/2_0_vulns/LLM05_ImproperOutputHandling.md

  - id: supply-chain-unpinned
    title: Unpinned model or tool versions
    description: >-
      The model version, tool packages or tool servers are not pinned. A
      silent upstream change (or a deliberate rug pull) alters behaviour and
      permissions without any review.
    stride: tampering
    owasp_llm: [LLM03]
    owasp_agentic: [ASI04]
    mitre_atlas: [AML.T0010, AML.T0010.005, AML.T0109]
    applies_when:
      any:
        - agent_model_unpinned
        - tool_unpinned
    likelihood: 2
    impact: 4
    mitigations:
      - tool-integrity-pinning
      - model-version-pinning
      - adversarial-testing
    references:
      - https://github.com/OWASP/www-project-top-10-for-large-language-model-applications/blob/main/2_0_vulns/LLM03_SupplyChain.md

  - id: no-rate-limits
    title: No rate limits on tool calls
    description: >-
      Nothing bounds how many tool calls or loop iterations an agent may make.
      A runaway loop or an attacker-driven burst exhausts quotas, floods
      downstream systems and amplifies every other threat.
    stride: denial-of-service
    owasp_llm: [LLM10]
    owasp_agentic: [ASI08]
    mitre_atlas: [AML.T0029, AML.T0034]
    applies_when:
      all:
        - "control_missing(control=rate-limiting)"
        - agent_has_any_tool
    likelihood: 3
    impact: 3
    mitigations:
      - rate-limiting
      - budget-caps
      - behavioural-monitoring

  - id: cross-agent-trust
    title: Implicit trust between agents
    description: >-
      One agent passes tasks to another. The receiving agent treats the
      message as an instruction from a trusted operator, so an injection in
      the first agent's input is laundered into a privileged action by the
      second (a confused deputy).
    stride: spoofing
    owasp_llm: [LLM01, LLM06]
    owasp_agentic: [ASI07, ASI08]
    mitre_atlas: [AML.T0051.001, AML.T0073]
    applies_when: agent_delegates_to_agent
    likelihood: 3
    impact: 4
    mitigations:
      - agent-identity
      - input-provenance-tagging
      - least-privilege-tool-scopes
      - audit-log

  - id: hitl-bypass
    title: Human-in-the-loop enforced only in the prompt
    description: >-
      The agent is meant to ask before acting, but the rule lives in the
      prompt. An injected instruction, a jailbreak or a tool that calls
      another tool routes around the human.
    stride: elevation-of-privilege
    owasp_llm: [LLM06, LLM01]
    owasp_agentic: [ASI09, ASI01]
    mitre_atlas: [AML.T0053]
    applies_when:
      all:
        - "agent_autonomy_in(autonomy=act-with-approval)"
        - "control_missing(control=runtime-policy-enforcement)"
    likelihood: 3
    impact: 5
    mitigations:
      - runtime-policy-enforcement
      - approval-gates
      - audit-log
      - kill-switch

  - id: denial-of-wallet
    title: Denial of wallet
    description: >-
      The agent can spend money or paid API quota and nothing caps the
      amount per task. A loop, an injection or a malicious user turns the
      agent into a bill.
    stride: denial-of-service
    owasp_llm: [LLM10]
    owasp_agentic: [ASI08]
    mitre_atlas: [AML.T0034.002, AML.T0034]
    applies_when:
      all:
        - "control_missing(control=budget-caps)"
        - any:
            - "agent_has_tool_kind(kinds=payment|network)"
            - "agent_autonomy_in(autonomy=act)"
    likelihood: 3
    impact: 4
    mitigations:
      - budget-caps
      - rate-limiting
      - approval-gates
      - behavioural-monitoring
    references:
      - https://github.com/OWASP/www-project-top-10-for-large-language-model-applications/blob/main/2_0_vulns/LLM10_UnboundedConsumption.md

  - id: sensitive-data-disclosure
    title: Sensitive data reachable by the model
    description: >-
      The agent can read confidential or regulated records through a tool.
      Whatever enters the context can be summarised, quoted or exfiltrated,
      and a shared service account returns records the requesting user may
      not be entitled to.
    stride: information-disclosure
    owasp_llm: [LLM02]
    owasp_agentic: [ASI03, ASI02]
    mitre_atlas: [AML.T0057, AML.T0085.000, AML.T0036]
    applies_when: "agent_reaches_sensitive_store(min=confidential)"
    likelihood: 3
    impact: 4
    mitigations:
      - per-user-authorisation
      - least-privilege-tool-scopes
      - dlp-outbound
      - audit-log
    references:
      - https://github.com/OWASP/www-project-top-10-for-large-language-model-applications/blob/main/2_0_vulns/LLM02_SensitiveInformationDisclosure.md

  - id: system-prompt-leakage
    title: System prompt and configuration leakage
    description: >-
      Users or third-party content can coax the model into revealing its
      system prompt, tool list and configuration. On its own this is
      reconnaissance; it becomes serious when the prompt holds secrets or
      business rules.
    stride: information-disclosure
    owasp_llm: [LLM07]
    owasp_agentic: []
    mitre_atlas: [AML.T0056, AML.T0069.002, AML.T0084, AML.T0084.001]
    applies_when: "agent_has_input_of_origin(origin=user|third-party)"
    likelihood: 4
    impact: 2
    mitigations:
      - secrets-out-of-context
      - runtime-policy-enforcement
      - adversarial-testing
    references:
      - https://github.com/OWASP/www-project-top-10-for-large-language-model-applications/blob/main/2_0_vulns/LLM07_SystemPromptLeakage.md

  - id: destructive-write-actions
    title: Destructive actions through write tools
    description: >-
      The agent can modify or delete data and reads untrusted content. An
      injected instruction (or a plain mistake) deletes records, overwrites
      files or force-pushes over history.
    stride: tampering
    owasp_llm: [LLM06, LLM01]
    owasp_agentic: [ASI02]
    mitre_atlas: [AML.T0101]
    applies_when:
      all:
        - "agent_has_tool_kind(kinds=write)"
        - untrusted_channel_in_agent_inputs
    likelihood: 3
    impact: 4
    mitigations:
      - approval-gates
      - backups-and-rollback
      - least-privilege-tool-scopes
      - audit-log

  - id: low-trust-principal-drives-agent
    title: Low-trust principal drives an autonomous agent
    description: >-
      A principal the operator does not trust (anonymous users, external
      partners) can send instructions to an agent that acts without approval.
      The agent's tools are effectively exposed to the public.
    stride: spoofing
    owasp_llm: [LLM06]
    owasp_agentic: [ASI01, ASI03]
    mitre_atlas: [AML.T0053]
    applies_when:
      all:
        - low_trust_principal_feeds_agent
        - "agent_autonomy_in(autonomy=act)"
    likelihood: 3
    impact: 4
    mitigations:
      - approval-gates
      - agent-identity
      - least-privilege-tool-scopes
      - rate-limiting

  - id: session-cross-contamination
    title: Memory leaks between users or sessions
    description: >-
      The agent keeps memory and serves more than one user. Without strict
      partitioning, one user's data or instructions surface in another
      user's session.
    stride: information-disclosure
    owasp_llm: [LLM02]
    owasp_agentic: [ASI06]
    mitre_atlas: [AML.T0057, AML.T0092]
    applies_when:
      all:
        - "agent_memory_is(memory=session|persistent)"
        - "agent_has_input_of_origin(origin=user)"
    likelihood: 2
    impact: 4
    mitigations:
      - session-isolation
      - per-user-authorisation
      - memory-write-validation

  - id: malicious-file-input
    title: Malicious files and documents as input
    description: >-
      The agent parses files or documents. Crafted files exploit parser bugs,
      hide instructions in metadata or invisible text, and carry macros or
      links that later tools act on.
    stride: tampering
    owasp_llm: [LLM01]
    owasp_agentic: [ASI01]
    mitre_atlas: [AML.T0051.001, AML.T0011.000]
    applies_when: "agent_has_channel_kind(kinds=file|document, untrusted=true)"
    likelihood: 3
    impact: 3
    mitigations:
      - untrusted-content-isolation
      - sandboxed-execution
      - prompt-injection-filtering
      - input-provenance-tagging

  - id: hallucinated-actions
    title: Acting on hallucinated facts or identifiers
    description: >-
      The agent invents a package name, account id, file path or amount and
      a side-effecting tool executes it. Attackers register the names models
      tend to invent so the mistake resolves to something malicious.
    stride: tampering
    owasp_llm: [LLM09, LLM06]
    owasp_agentic: [ASI02, ASI04]
    mitre_atlas: [AML.T0060, AML.T0053]
    applies_when:
      all:
        - "agent_autonomy_in(autonomy=act|act-with-approval)"
        - "agent_has_tool_kind(kinds=exec|write|payment)"
    likelihood: 3
    impact: 3
    mitigations:
      - argument-validation
      - approval-gates
      - tool-integrity-pinning
      - adversarial-testing
    references:
      - https://arxiv.org/abs/2406.10279

  - id: agent-config-tampering
    title: Agent configuration tampering
    description: >-
      Prompts, tool lists and policies live in files or stores an agent can
      write to, or that lack change control. Modifying them silently changes
      what the agent is allowed to do.
    stride: tampering
    owasp_llm: [LLM03, LLM06]
    owasp_agentic: [ASI10, ASI04]
    mitre_atlas: [AML.T0081]
    applies_when:
      all:
        - "agent_has_tool_kind(kinds=write|exec)"
        - "control_missing(control=runtime-policy-enforcement)"
    likelihood: 2
    impact: 4
    mitigations:
      - runtime-policy-enforcement
      - tool-integrity-pinning
      - audit-log
      - least-privilege-tool-scopes
